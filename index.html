<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Awavox AI Studio</title>
    <script>
      // Workaround for environments where window.fetch has only a getter
      // and a library (e.g. remix/react-router) attempts to overwrite it.
      var originalFetch = window.fetch;
      try {
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: function() { return originalFetch; },
          set: function(v) { originalFetch = v; }
        });
      } catch (e) {
        // ignore if we can't redefine
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
